<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-array, sans-serif;
            background-color: #f4f4f9;
        }

        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        #display {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 10px;
            padding: 10px;
            box-sizing: border-box;
            border: none;
            background-color: #eee;
            border-radius: 5px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #555;
            color: white;
        }

        button:hover {
            background-color: #777;
        }

        button.operator {
            background-color: #f39c12;
        }

        button.operator:hover {
            background-color: #e67e22;
        }

        button.equals {
            background-color: #27ae60;
            grid-column: span 2;
        }

        button.equals:hover {
            background-color: #2ecc71;
        }

        button.clear {
            background-color: #c0392b;
            grid-column: span 2;
        }

        button.clear:hover {
            background-color: #e74c3c;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <input type="text" id="display" disabled>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendToDisplay('/')">/</button>
            <button class="operator" onclick="appendToDisplay('*')">×</button>
            <button class="operator" onclick="appendToDisplay('Math.PI')">π</button>
            <button class="operator" onclick="appendToDisplay('Math.E')">e</button>
            <button class="operator" onclick="appendToDisplay('Math.sqrt(')">√</button>
            <button class="operator" onclick="appendToDisplay('**')">^</button>
            <button class="operator" onclick="appendToDisplay('Math.log10(')">log</button>
            <button class="operator" onclick="appendToDisplay('Math.log(')">ln</button>
            <button class="operator" onclick="appendToDisplay('(')">(</button>
            <button class="operator" onclick="appendToDisplay(')')">)</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('-')">-</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button class="equals" onclick="calculate()">=</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendToDisplay(input) {
            display.value += input;
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculate() {
            try {
                // Replace common math notation for eval
                let expression = display.value.replace(/×/g, '*').replace(/÷/g, '/');
                display.value = eval(expression);
            } catch (error) {
                display.value = 'Error';
            }
        }

        document.addEventListener('keydown', (event) => {
            const key = event.key;
            if (/[0-9\+\-\*\/\.]/.test(key)) {
                appendToDisplay(key);
            } else if (key === 'Enter' || key / key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Escape' || key === 'c' || key === 'C') {
                clearDisplay();
            } else if (key === 'Backspace') {
                display.value = display.value.slice(0, -1);
            }
        });
    </script>

</body>

</html>
